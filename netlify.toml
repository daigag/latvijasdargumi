# Vienmēr atvērt drošo (https) adresi
[[redirects]]
  from = "http://latvijasdargumi.lv/*"
  to = "https://latvijasdargumi.lv/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.latvijasdargumi.lv/*"
  to = "https://latvijasdargumi.lv/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.latvijasdargumi.lv/*"
  to = "https://latvijasdargumi.lv/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "upgrade-insecure-requests"
